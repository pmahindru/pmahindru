<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-label="Pranav Mahindru — Full Stack Developer, animated luxury technology banner">
<defs>
  <linearGradient id="base" x2="1" y2="1"><stop stop-color="#08090E"/><stop offset=".58" stop-color="#140C23"/><stop offset="1" stop-color="#050B14"/></linearGradient>
  <linearGradient id="gold"><stop stop-color="#8B6938"/><stop offset=".35" stop-color="#F8E0A4"/><stop offset=".7" stop-color="#CDA969"/><stop offset="1" stop-color="#7D5B33"/></linearGradient>
  <linearGradient id="electric"><stop stop-color="#D1A969"/><stop offset=".45" stop-color="#9F72FF"/><stop offset="1" stop-color="#57E5E4"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#7954DB" stop-opacity=".26"/><stop offset="1" stop-color="#7954DB" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#A78BFA" stroke-opacity=".065"/></pattern>
  <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<style>
  .dash{stroke-dasharray:16 24;animation:dash 14s linear infinite}
  .flow{stroke-dasharray:190 780;animation:flow 9s linear infinite}
  .pulse{animation:pulse 4s ease-in-out infinite}
  .pulse2{animation:pulse 5s ease-in-out -2s infinite}
  .float{animation:float 8s ease-in-out infinite}
  .blink{animation:blink 1.1s steps(1) infinite}
  .reveal{animation:appear 2s ease-out both}
  @keyframes dash{to{stroke-dashoffset:-400}}
  @keyframes flow{to{stroke-dashoffset:-970}}
  @keyframes pulse{50%{opacity:.3}}
  @keyframes float{50%{transform:translateY(-10px)}}
  @keyframes blink{50%{opacity:0}}
  @keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="370" rx="22" fill="url(#base)"/>
<rect width="1200" height="370" rx="22" fill="url(#grid)"/>
<ellipse cx="830" cy="170" rx="420" ry="255" fill="url(#halo)" class="pulse"/>
<path d="M0 20H1180V350H20V20" fill="none" stroke="#C9A36B" stroke-opacity=".36"/>
<path d="M23 22H1177V348H23Z" fill="none" stroke="#62DADD" stroke-opacity=".20" class="dash"/>
<path d="M0 293C245 235 377 345 582 249S930 143 1200 210" fill="none" stroke="url(#electric)" stroke-width="1.7" opacity=".5" class="flow"/>
<path d="M0 315C270 271 414 342 640 261S970 170 1200 244" fill="none" stroke="#CBA866" stroke-width="1" opacity=".26"/>
<g class="float">
 <circle cx="970" cy="167" r="106" fill="none" stroke="#C8A46C" stroke-opacity=".5"/>
 <circle cx="970" cy="167" r="81" fill="none" stroke="#9A79D8" stroke-opacity=".35" stroke-dasharray="4 11"/>
 <circle cx="970" cy="167" r="119" fill="none" stroke="#61D9DE" stroke-opacity=".16" stroke-dasharray="35 20"/>
 <path d="M913 165L953 125L1003 175L1031 146" fill="none" stroke="url(#electric)" stroke-width="2"/>
 <path d="M912 194H1035" stroke="#F3DC9C" stroke-opacity=".65"/>
 <text x="970" y="220" text-anchor="middle" fill="#E1C68D" font-size="12" font-family="monospace" letter-spacing="5">PM / 01</text>
</g>
<g class="reveal">
  <text x="76" y="82" fill="#E8C78B" font-size="14" font-family="monospace" letter-spacing="5">SOFTWARE ENGINEER  /  HALIFAX, CA</text>
  <text x="73" y="164" fill="#FCF5E8" font-size="65" font-weight="700" letter-spacing="2.5" font-family="Georgia, Times New Roman, serif">PRANAV</text>
  <text x="73" y="235" fill="url(#gold)" font-size="66" font-weight="700" font-style="italic" letter-spacing="1" font-family="Georgia, Times New Roman, serif">MAHINDRU</text>
  <text x="76" y="279" fill="#BDB7CD" font-size="16" font-family="monospace">Full stack engineering · cloud systems · purposeful design</text>
  <rect x="76" y="304" width="12" height="12" rx="6" fill="#57E5CF" class="pulse2"/>
  <text x="100" y="315" fill="#E9D9BA" font-family="monospace" font-size="13" letter-spacing="2">BUILD / REFINE / SHIP</text>
  <rect x="322" y="302" width="2" height="16" fill="#CBA866" class="blink"/>
</g>
</svg>